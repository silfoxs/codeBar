name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package unsigned app
        run: ./scripts/package-app.sh
        env:
          CODESIGN_IDENTITY: '-'
      - name: Verify app bundle
        run: |
          test -x dist/AIUsageBar.app/Contents/MacOS/AIUsageBar
          plutil -p dist/AIUsageBar.app/Contents/Info.plist
          codesign --verify --deep --strict dist/AIUsageBar.app
