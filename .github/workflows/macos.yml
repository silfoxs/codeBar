name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve app version
        id: resolve-version
        run: |
          set -euo pipefail

          # Keep the release version in source control. A stale repository
          # variable must not recreate an already-published release tag.
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid app version: $APP_VERSION" >&2
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using codeBar version $APP_VERSION"

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Build app bundle and installers
        env:
          CODESIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          make package
          make dmg

      - name: Verify app bundle
        run: |
          set -euo pipefail
          test -x dist/codeBar.app/Contents/MacOS/codeBar
          plutil -p dist/codeBar.app/Contents/Info.plist
          codesign --verify --deep --strict dist/codeBar.app
          test -f "dist/codeBar-${APP_VERSION}.zip"
          test -f "dist/codeBar-${APP_VERSION}.dmg"

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: codeBar-v${{ steps.resolve-version.outputs.app_version }}
          RELEASE_TITLE: codeBar-v${{ steps.resolve-version.outputs.app_version }}
          ZIP_PATH: dist/codeBar-${{ steps.resolve-version.outputs.app_version }}.zip
          DMG_PATH: dist/codeBar-${{ steps.resolve-version.outputs.app_version }}.dmg
        run: |
          set -euo pipefail

          RELEASE_EXISTS=0
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            RELEASE_EXISTS=1
            IS_DRAFT="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release $TAG_NAME is already published. Bump APP_VERSION before creating a new draft." >&2
              exit 1
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG_NAME" --force

          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Draft build from main commit ${SHORT_SHA}: $(basename "$DMG_PATH") and $(basename "$ZIP_PATH")."

          if [[ "$RELEASE_EXISTS" -eq 1 ]]; then
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "$NOTES"
            while IFS= read -r asset_name; do
              case "$asset_name" in
                codeBar-*.zip|codeBar-*.dmg)
                  gh release delete-asset "$TAG_NAME" "$asset_name" --yes
                  ;;
              esac
            done < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
            gh release upload "$TAG_NAME" "$ZIP_PATH" "$DMG_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$ZIP_PATH" "$DMG_PATH" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --draft
          fi
